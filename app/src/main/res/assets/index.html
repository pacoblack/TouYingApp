<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投影仪快传</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>投影仪快传</h1>

<div class="card">
    <h2>1. 推送文字 / 网址到投影仪</h2>
    <div class="form-group">
        <textarea id="textInput" rows="3" placeholder="输入要发送的文字或网址..."></textarea>
    </div>
    <button id="sendTextBtn">发送文字</button>
</div>

<div class="card">
    <h2>2. 上传文件 / 文件夹到指定目录</h2>
    <div class="form-group">
        <label>投影仪基准路径：<strong>{{ROOT_PATH}}</strong></label>
    </div>
    <div class="form-group">
        <label for="folderSelect">选择存储目录：</label>
        <select id="folderSelect">{{FOLDER_OPTIONS}}</select>
    </div>
    <div class="form-group">
        <label for="newFolderInput">新建子文件夹（可选，留空则直接存入上方目录）：</label>
        <input type="text" id="newFolderInput" placeholder="例如：会议资料">
    </div>

    <div class="drop-zone" id="dropZone">
        <p>将文件或文件夹拖拽到此处（单次最多 <strong id="maxCountLabel">10</strong> 个文件）</p>
        <button type="button" class="btn-outline" id="btnPickFiles">选择文件</button>
        <button type="button" class="btn-outline" id="btnPickFolder">选择文件夹</button>
        <input type="file" id="fileInput" multiple hidden>
        <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
    </div>

    <div class="action-bar">
        <button id="startUploadBtn" disabled>开始上传 (0)</button>
        <button type="button" class="btn-outline" id="clearListBtn">清空列表</button>
    </div>

    <ul class="file-list" id="fileList"></ul>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
